[package]
name = "microharness"
version = "0.1.1"
edition = "2024"
description = "A minimal agentic harness for local Ollama serve"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
